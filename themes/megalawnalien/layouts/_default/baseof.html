<!DOCTYPE html>
<html lang="{{ or site.Language.LanguageCode site.Language.Lang }}" dir="{{ or site.Language.Direction `ltr` }}">
  <head>
    {{ partial "head.html" . }}
  </head>
  <body data-theme="light">
    <div class="wrapper">
      <a
          href="#content"
          aria-label="jump to main content"
          >Jump to Content</a>
      <header class="landing__header">
        {{if ne .Page.Path "/traverse-city-web-design-and-development"}}
        {{ partial "components/theme-toggle.html" }}
        {{ partial "header.html" . }}
        {{ end }}
      </header>
      <main id="content">
        {{ block "main" . }}{{ end }}
      </main>
      {{ block "sidebar" . }}

      {{ end }}
      <footer>
        {{ partial "footer.html" . }}
      </footer>
    </div>
  </body>
</html>
